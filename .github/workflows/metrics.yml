name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch: 

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    # Adicione este bloco de permissões:
    permissions:
      contents: write
      
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Galaticos-API
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
